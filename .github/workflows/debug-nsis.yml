name: debug-nsis

# Temporary: installs Akev with winget and watches the processes it starts.

on:
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: winget install, watched
        shell: pwsh
        run: |
          winget --version
          winget settings --enable LocalManifestFiles
          $dir = (Get-ChildItem winget\manifests\a\Akev\Akev -Directory | Select-Object -First 1).FullName
          $start = Get-Date
          $p = Start-Process winget -ArgumentList @('install', '--manifest', "`"$dir`"", '--silent',
            '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity', '--verbose-logs') `
            -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\winget.out"
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep 10
            "--- t+$([int]((Get-Date) - $start).TotalSeconds)s winget exited=$($p.HasExited)"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt $start } |
              ForEach-Object { "{0,-8} parent={1,-8} {2}  {3}" -f $_.ProcessId, $_.ParentProcessId, $_.Name, $_.CommandLine }
            if ($p.HasExited) { "winget exit code $($p.ExitCode)"; break }
          }
          "=== winget output"; Get-Content "$env:RUNNER_TEMP\winget.out" -ErrorAction SilentlyContinue | Select-Object -Last 20
          $logs = "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
          $log = Get-ChildItem $logs | Sort-Object LastWriteTime | Select-Object -Last 1
          "=== $($log.Name)"; Get-Content $log.FullName | Select-String -NotMatch 'SystemComponent|Did not find an Id|Adding manifest for \[ARP' | Select-Object -Last 60
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq 'Akev' | Format-List DisplayName, InstallLocation, PSChildName
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
