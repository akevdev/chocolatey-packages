name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chocolatey:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Make sure Chocolatey is installed
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            "$env:ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          }
      - name: Pack
        shell: pwsh
        run: choco pack akev\akev.nuspec --outputdirectory out
      - name: Install
        shell: pwsh
        run: |
          choco install akev --source "$env:GITHUB_WORKSPACE\out" -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arp = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'Akev'
          if (-not $arp) { throw 'No Akev entry in Programs and Features' }
          $arp | Select-Object DisplayName, DisplayVersion, Publisher, InstallLocation, PSChildName | Format-List
          Get-ChildItem "$env:ProgramFiles\Akev" | Format-Table Name, Length
      - name: Uninstall
        shell: pwsh
        run: |
          choco uninstall akev -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arp = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -eq 'Akev'
          if ($arp) { throw 'Akev is still installed' }

  winget:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      MANIFEST: winget\manifests\a\Akev\Akev
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest winget
        shell: pwsh
        run: |
          Install-PSResource -Name Microsoft.WinGet.Client -TrustRepository -Scope AllUsers -Quiet
          Import-Module Microsoft.WinGet.Client
          # Windows Server images can't take the App Installer bundle (0x80073CF1); keep the
          # preinstalled winget there.
          try { Repair-WinGetPackageManager -AllUsers -Latest -Force -ErrorAction Stop }
          catch { Write-Warning "Couldn't update winget: $_" }
          winget --version
      - name: Validate the manifests
        shell: pwsh
        run: |
          $dir = (Get-ChildItem $env:MANIFEST -Directory | Select-Object -First 1).FullName
          "MANIFEST_DIR=$dir" >> $env:GITHUB_ENV
          $out = winget validate --manifest $dir | Out-String
          $out
          # Warnings return a non-zero code too; only a failed validation should fail the job.
          if ($out -notmatch 'Manifest validation succeeded') { exit 1 }
      - name: Install with winget
        timeout-minutes: 10
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest $env:MANIFEST_DIR --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --verbose-logs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arp = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object DisplayName -eq 'Akev'
          if (-not $arp) { throw 'No per-user Akev entry in Programs and Features' }
          $arp | Select-Object DisplayName, DisplayVersion, Publisher, InstallLocation, PSChildName | Format-List
          if (-not (Test-Path "$env:LOCALAPPDATA\Akev")) { throw 'Not installed to %LocalAppData%\Akev' }
          Get-ChildItem "$env:LOCALAPPDATA\Akev" | Format-Table Name, Length
          winget list --name Akev --accept-source-agreements
      - name: winget logs
        if: failure() || cancelled()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'akev|setup|winget|WindowsPackageManager|MicrosoftEdgeWebview|nsis' } |
            Format-Table ProcessName, Id, StartTime, Path -AutoSize | Out-String -Width 300
          $dir = "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 2 |
            ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue |
            Select-Object pv, name | Format-List

      - name: Uninstall with winget
        timeout-minutes: 10
        shell: pwsh
        run: |
          winget uninstall --name Akev --silent --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
