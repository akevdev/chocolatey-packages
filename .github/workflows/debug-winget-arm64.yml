name: debug-winget-arm64

# Temporary: installs Akev with winget on Windows 11 arm64 and watches what it starts.

on:
  workflow_dispatch:

jobs:
  winget:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: winget install, watched
        shell: pwsh
        run: |
          New-Item -Force 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' EnableSmartScreen 0 -Type DWord
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' SmartScreenEnabled 'Off'
          foreach ($hive in 'HKCU:', 'HKLM:') {
            $k = "$hive\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments"
            New-Item -Force $k | Out-Null
            Set-ItemProperty $k SaveZoneInformation 1 -Type DWord
          }
          "SmartAppControl: $((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -ErrorAction SilentlyContinue).VerifiedAndReputablePolicyState)"
          winget settings --enable LocalManifestFiles | Out-Null
          $dir = (Get-ChildItem winget\manifests\a\Akev\Akev -Directory | Select-Object -First 1).FullName
          $start = Get-Date
          $p = Start-Process winget -ArgumentList @('install', '--manifest', "`"$dir`"", '--silent',
            '--accept-package-agreements', '--accept-source-agreements', '--disable-interactivity') `
            -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\winget.out"
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep 10
            "--- t+$([int]((Get-Date) - $start).TotalSeconds)s winget exited=$($p.HasExited)"
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -gt $start -and $_.Name -notmatch 'conhost|MpCmdRun|WmiPrvSE' } |
              ForEach-Object { "{0,-8} parent={1,-8} {2}  {3}" -f $_.ProcessId, $_.ParentProcessId, $_.Name, $_.CommandLine }
            Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.ProcessName): $($_.MainWindowTitle)" }
            if ($p.HasExited) { "winget exit code $($p.ExitCode)"; break }
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\screen.png")
          "=== winget output"; Get-Content "$env:RUNNER_TEMP\winget.out" -ErrorAction SilentlyContinue | Select-Object -Last 10
          Get-ChildItem "$env:LOCALAPPDATA\Akev" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-WinEvent -LogName 'Microsoft-Windows-SmartScreen/Debug', 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 10 -ErrorAction SilentlyContinue |
            Where-Object TimeCreated -gt $start | Format-List TimeCreated, Id, Message
          if (-not $p.HasExited) { Get-Process | Where-Object ProcessName -match 'setup|winget' | Stop-Process -Force }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-arm64
          path: ${{ runner.temp }}/screen.png
